{% extends "base.html" %}
{% block title %}Importa bookmark — Cozy Bookmarks{% endblock %}
{% block body %}
<header class="app-header">
  <a href="/" class="back-icon" aria-label="Torna alla lista" title="Torna alla lista">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </a>
  <h1>Importa bookmark</h1>
</header>

<p class="remaining">Carica il file HTML esportato dal tuo browser (di solito: Impostazioni → Bookmark → Esporta bookmark). I link già salvati vengono saltati automaticamente.</p>

<form method="post" action="/bookmarks/import" enctype="multipart/form-data" class="organize-form">
  <label>File
    <input type="file" name="file" accept=".html,text/html" required>
  </label>
  <button type="submit">Importa</button>
</form>
{% endblock %}
