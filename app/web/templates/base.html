<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cozy Bookmarks{% endblock %}</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        if (stored && stored !== "system") {
          document.documentElement.dataset.theme = stored;
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icons/icon-192.png">
  <meta name="theme-color" content="#b5651d">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/sortable.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg>
      Cozy Bookmarks
      <span class="brand-version">({{ app_version }})</span>
    </a>
    {% if current_user %}
    <details class="user-menu">
      <summary class="user-menu-trigger" aria-label="Menu utente">&#9776;</summary>
      <div class="user-menu-panel">
        <p class="user-menu-email">{{ current_user.email }}</p>
        <label for="theme-select" class="visually-hidden">Tema</label>
        <select id="theme-select"></select>
        <a href="/bookmarks/import">Importa</a>
        <form method="post" action="/logout"><button type="submit" class="link-button">Esci</button></form>
      </div>
    </details>
    {% else %}
    <div class="theme-switcher-inline">
      <label for="theme-select" class="visually-hidden">Tema</label>
      <select id="theme-select"></select>
    </div>
    {% endif %}
  </header>
  {% block body %}{% endblock %}
  <script>
    (function () {
      var THEMES = [
        { value: "system", label: "Sistema" },
        { value: "light", label: "Chiaro" },
        { value: "dark", label: "Scuro" }
      ];
      var select = document.getElementById("theme-select");
      THEMES.forEach(function (theme) {
        var option = document.createElement("option");
        option.value = theme.value;
        option.textContent = theme.label;
        select.appendChild(option);
      });

      var current = "system";
      try {
        current = localStorage.getItem("theme") || "system";
      } catch (e) {}
      select.value = current;

      select.addEventListener("change", function () {
        var value = select.value;
        try {
          localStorage.setItem("theme", value);
        } catch (e) {}
        if (value === "system") {
          delete document.documentElement.dataset.theme;
        } else {
          document.documentElement.dataset.theme = value;
        }
      });
    })();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }

    document.addEventListener("DOMContentLoaded", function () {
      var bookmarkList = document.getElementById("bookmark-list");
      if (!bookmarkList || typeof Sortable === "undefined") {
        return;
      }
      var dropBar = document.getElementById("tag-drop-bar");

      Sortable.create(bookmarkList, {
        handle: ".drag-handle",
        animation: 150,
        delay: 250,
        delayOnTouchOnly: true,
        group: { name: "bookmarks", pull: "clone", put: false },
        onStart: function () {
          if (dropBar) {
            dropBar.classList.add("active");
          }
        },
        onEnd: function (evt) {
          if (dropBar) {
            dropBar.classList.remove("active");
          }
          if (evt.to !== evt.from) {
            // dropped on a tag target instead of reordered within the list -
            // that target's own onAdd handles it, nothing to persist here
            return;
          }
          var id = evt.item.id.replace("bookmark-", "");
          var above = evt.item.previousElementSibling;
          var below = evt.item.nextElementSibling;
          var aboveId = above ? above.id.replace("bookmark-", "") : "";
          var belowId = below ? below.id.replace("bookmark-", "") : "";
          fetch("/bookmarks/" + id + "/reorder", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "above_id=" + encodeURIComponent(aboveId) + "&below_id=" + encodeURIComponent(belowId),
          });
        },
      });

      if (dropBar) {
        dropBar.querySelectorAll(".tag-drop-target").forEach(function (target) {
          Sortable.create(target, {
            group: { name: "bookmarks", pull: false, put: true },
            sort: false,
            onAdd: function (evt) {
              var id = evt.item.id.replace("bookmark-", "");
              var tagName = target.dataset.tagName;
              evt.item.remove();
              fetch("/bookmarks/" + id + "/tags/add", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "name=" + encodeURIComponent(tagName),
              }).then(function () {
                window.location.reload();
              });
            },
          });
        });
      }
    });

    document.addEventListener("DOMContentLoaded", function () {
      var tagsInput = document.getElementById("tags-input");
      var tagSearch = document.getElementById("tag-search");
      var suggestionsBox = document.getElementById("tag-suggestions");
      var tagsDataEl = document.getElementById("all-tags-data");
      if (!tagsInput || !tagSearch || !suggestionsBox || !tagsDataEl) {
        return;
      }

      var allTags = JSON.parse(tagsDataEl.textContent || "[]");
      var defaultSuggestionsHtml = suggestionsBox.innerHTML;

      function addTagToInput(name) {
        var current = tagsInput.value
          .split(",")
          .map(function (s) { return s.trim(); })
          .filter(Boolean);
        if (current.indexOf(name) === -1) {
          current.push(name);
        }
        tagsInput.value = current.join(", ");
      }

      suggestionsBox.addEventListener("click", function (evt) {
        if (evt.target.classList.contains("tag-chip")) {
          addTagToInput(evt.target.dataset.tag);
        }
      });

      tagSearch.addEventListener("input", function () {
        var query = tagSearch.value.trim().toLowerCase();
        if (!query) {
          suggestionsBox.innerHTML = defaultSuggestionsHtml;
          return;
        }
        var matches = allTags.filter(function (t) {
          return t.toLowerCase().indexOf(query) !== -1;
        });
        suggestionsBox.textContent = "";
        if (matches.length === 0) {
          var noMatch = document.createElement("span");
          noMatch.className = "tag-suggestion-label";
          noMatch.textContent = "Nessun tag corrispondente";
          suggestionsBox.appendChild(noMatch);
          return;
        }
        matches.forEach(function (t) {
          var button = document.createElement("button");
          button.type = "button";
          button.className = "tag-chip";
          button.dataset.tag = t;
          button.textContent = t;
          suggestionsBox.appendChild(button);
        });
      });
    });
  </script>
</body>
</html>
