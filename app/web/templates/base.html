<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}cozy-bookmarks{% endblock %}</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        if (stored && stored !== "system") {
          document.documentElement.dataset.theme = stored;
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icons/icon-192.png">
  <meta name="theme-color" content="#b5651d">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">cozy-bookmarks</a>
    {% if current_user %}
    <details class="user-menu">
      <summary class="user-menu-trigger" aria-label="Menu utente">&#9776;</summary>
      <div class="user-menu-panel">
        <p class="user-menu-email">{{ current_user.email }}</p>
        <label for="theme-select" class="visually-hidden">Tema</label>
        <select id="theme-select"></select>
        <a href="/bookmarks/import">Importa</a>
        <form method="post" action="/logout"><button type="submit" class="link-button">Esci</button></form>
      </div>
    </details>
    {% else %}
    <div class="theme-switcher-inline">
      <label for="theme-select" class="visually-hidden">Tema</label>
      <select id="theme-select"></select>
    </div>
    {% endif %}
  </header>
  {% block body %}{% endblock %}
  <script>
    (function () {
      var THEMES = [
        { value: "system", label: "Sistema" },
        { value: "light", label: "Chiaro" },
        { value: "dark", label: "Scuro" }
      ];
      var select = document.getElementById("theme-select");
      THEMES.forEach(function (theme) {
        var option = document.createElement("option");
        option.value = theme.value;
        option.textContent = theme.label;
        select.appendChild(option);
      });

      var current = "system";
      try {
        current = localStorage.getItem("theme") || "system";
      } catch (e) {}
      select.value = current;

      select.addEventListener("change", function () {
        var value = select.value;
        try {
          localStorage.setItem("theme", value);
        } catch (e) {}
        if (value === "system") {
          delete document.documentElement.dataset.theme;
        } else {
          document.documentElement.dataset.theme = value;
        }
      });
    })();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
